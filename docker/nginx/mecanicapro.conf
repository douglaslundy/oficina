map $host $tenant_valid {
    hostnames;
    default 0;
    oficina.dlsistemas.com.br 1;
    saas.dlsistemas.com.br 1;
    include /etc/nginx/conf.d/tenant-slugs.map;
}

map $tenant_valid $tenant_invalid {
    0 1;
    1 0;
}

log_format ghost '$remote_addr - [$time_local] "$request" host="$host" status=$status';

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Falha achada corrigindo a migração de auth pra sessão httpOnly (2026-09-14):
# este nginx só escuta HTTP puro (TLS termina no Traefik, na frente dele) —
# `$scheme` aqui é SEMPRE "http", nunca reflete o protocolo real do
# visitante. Repassar `X-Forwarded-Proto: $scheme` (como estava) sobrescrevia
# o valor correto que o Traefik já tinha mandado, fazendo o Laravel achar que
# toda requisição era HTTP — e por isso tratava a porta 443 como "não
# padrão" e anexava ":443" no host resolvido
# (Symfony\Request::getHttpHost()), quebrando EnsureFrontendRequestsAreStateful
# pra qualquer domínio que dependesse do placeholder dinâmico
# (`__SANCTUM_CURRENT_REQUEST_HOST__`) — confirmado ao vivo via rota de
# diagnóstico temporária (getHttpHost = "stuntmotos.dlsistemas.com.br:443").
# Repassa o valor que já veio do Traefik; só usa $scheme como fallback
# (acesso direto sem Traefik na frente, ex.: teste local).
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # IP real do visitante: sem isto, o remote_addr sempre mostra o gateway
    # da rede docker do mecanicapro (172.23.0.1), que é por onde o Traefik
    # encaminha TODO o tráfego (real e fantasma) desde que o Traefik passou
    # a ficar na frente deste nginx. Sem isto, o log de subdomínios
    # fantasmas e o jail do fail2ban nunca identificam o IP de verdade
    # (58853 tentativas registradas, só 172.23.0.1 como origem) — e os
    # cabeçalhos X-Real-IP enviados ao backend/frontend também ficam errados.
    set_real_ip_from 172.23.0.1;
    real_ip_header X-Forwarded-For;

    # Docker's internal DNS — re-resolve hostnames quando containers reiniciam
    resolver 127.0.0.11 valid=5s ipv6=off;

    # 550M cobre o upload de um backup .sql.gz na tela de restauração
    # (BackupController::importar valida max:512000 KB). Uploads normais do
    # app são muito menores (certificado A1, XML de NF).
    client_max_body_size 550M;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    access_log /var/log/mecanicapro/ghost_subdomains.log ghost if=$tenant_invalid;

    if ($tenant_valid = 0) {
        return 444;
    }

    # Backend API routes
    location /api/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Sanctum CSRF cookie
    location /sanctum/ {
        set $backend_host backend:8000;
        proxy_pass http://$backend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
    }

    # Next.js frontend (includes _next/static, _next/image, etc.)
    location / {
        set $frontend_host frontend:3000;
        proxy_pass http://$frontend_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $real_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
