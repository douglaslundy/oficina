name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHPUnit + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mecanicapro
          POSTGRES_USER: mecanicapro
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mecanicapro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: mecanicapro
      DB_USERNAME: mecanicapro
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, bcmath, zip, xml, dom, gd, soap, pcntl, fileinfo
          coverage: none
          tools: composer:v2

      - name: Cache Composer deps
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: cp .env.example .env
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan key:generate

      - name: PHPUnit — Unit (gate)
        run: php artisan test --testsuite=Unit

      - name: PHPUnit — Feature (contra Postgres)
        # Reabilitado 2026-09-04: a suíte Feature nunca tinha rodado contra um
        # Postgres real — ~80 testes escritos "no papel" falham por dívida
        # acumulada (Oficina sem cnpj, Http::fake que não casa, tenant não
        # preenchido). Rehab em andamento; por ora não bloqueia o merge, mas
        # a falha fica visível. Remover o continue-on-error quando zerar.
        continue-on-error: true
        run: php artisan test --testsuite=Feature

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
